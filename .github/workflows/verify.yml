name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/release_gate.py --history
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -O -m unittest discover -s tests -q
      - run: find apps packages -name '*.js' -exec node --check {} \;
